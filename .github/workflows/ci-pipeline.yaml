name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'dev-*'
      - deploy
      - ci-pipeline

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # React Frontend CI
  # ==========================================
  react-build:
    name: React CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin_web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build React application
        run: npm run build


  # ==========================================
  # .NET Backend CI
  # ==========================================
  backend-test:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release


  # ==========================================
  # Python AI Service CI
  # ==========================================
  ai-service-test:
    name: AI service tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai_service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai_service/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run AI service tests
        run: python -m pytest