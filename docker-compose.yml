services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecoloop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./ai_service
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-flash-latest}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:?Set AI_SERVICE_KEY in .env}
      BACKEND_URL: http://backend:5252
    expose:
      - "8000"

  backend:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-ecoloop};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-EcoLoopBackend}
      Jwt__Audience: ${JWT_AUDIENCE:-EcoLoopFrontend}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      AiService__BaseUrl: http://ai-service:8000
      AiService__ApiKey: ${AI_SERVICE_KEY:?Set AI_SERVICE_KEY in .env}
    volumes:
      - uploads:/app/wwwroot/uploads
    ports:
      - "5252:5252"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  admin-web:
    build:
      context: ./admin_web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5252}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
